[build]
  command = "npm run sync:catalog && npm run validate:catalog && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/posts"
  to = "/data/posts.json"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/data/settings.json"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/404.json"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-src 'self' https://googleads.g.doubleclick.net https://*.firebaseio.com https://*.googleapis.com;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/worthora_logo.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
